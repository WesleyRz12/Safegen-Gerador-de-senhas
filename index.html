<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeGen - Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="unlock.svg" alt="cadeado fechado">
            <h2 class="titulo-principal">SafeGen</h2>
            <h3 class="titulo-secundario">GERADOR DE SENHAS</h3>
        </div>

        <div class="conteudo-senha">
            <label for="senha">Senha</label>
            <input name="senha" type="text" id="campo-senha" readonly>
        </div>

        <div class="parametro">
            <h3 class="parametro-titulo">GERE SENHAS FORTES</h3>

            <div class="parametro-coluna__senha">

                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Tamanho da senha</h4>

                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha__botao">−</button>
                        <p class="parametro-senha__texto">12</p>
                        <button class="parametro-senha__botao">+</button>
                    </div>
                </div>

                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Características da senha</h4>

                    <div class="parametro-senha-checkbox">
                        <input name="maiusculo" type="checkbox" class="checkbox" checked>
                        <label for="maiusculo">Maiúsculas</label>
                    </div>

                    <div class="parametro-senha-checkbox">
                        <input name="minusculo" type="checkbox" class="checkbox">
                        <label for="minusculo">Minúsculas</label>
                    </div>

                    <div class="parametro-senha-checkbox">
                        <input name="numero" type="checkbox" class="checkbox">
                        <label for="numero">Números</label>
                    </div>

                    <div class="parametro-senha-checkbox">
                        <input name="simbolos" type="checkbox" class="checkbox">
                        <label for="simbolos">Símbolos</label>
                    </div>
                </div>

                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Força da senha</h4>

                    <div class="barra"></div>
                    <div class="forca media"></div>

                    <div class="parametro-senha-texto">
                        <p>Fraca</p>
                        <p>Média</p>
                        <p>Forte</p>
                    </div>
                </div>

            </div>
        </div>
    </section>
    <script src="main.js"></script>
</body>
</html>
